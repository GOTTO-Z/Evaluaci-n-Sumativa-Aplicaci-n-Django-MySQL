<!DOCTYPE html>
<html>
<head><title>Editar Prenda</title></head>
<body>
    <h1>Editar: {{ prenda.nombre }}</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Nombre:</label><br>
        <input type="text" name="nombre" value="{{ prenda.nombre }}" required><br><br>
        
        <label>Descripción:</label><br>
        <textarea name="descripcion" required>{{ prenda.descripcion }}</textarea><br><br>
        
        <label>Disponible en inventario:</label>
        <input type="checkbox" name="disponible" {% if prenda.disponible %}checked{% endif %}><br><br>
        
        <button type="submit">Actualizar Prenda</button>
    </form>
    <br><a href="{% url 'inicio' %}">Cancelar</a>
</body>
</html>
